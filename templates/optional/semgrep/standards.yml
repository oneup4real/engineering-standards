# Opt-in Semgrep rules for Next.js server actions (oneup4real/engineering-standards).
# Install with: npx oneup-standards add sast   (copies this file to .semgrep/standards.yml)
# Suppress a reviewed finding on the line above it with: // nosemgrep: <rule id> - <reason>
# Fixtures for these rules: standards.tsx next to this file in the package (run `semgrep --test` there).
rules:
  - id: standards.server-action-missing-auth-guard
    message: >-
      Exported server action without a visible caller check. Every exported action is a public endpoint:
      call requireAuth/requireStaff/requireRole/requireSelfOrAdmin (or a token check) in its body, or mark a
      deliberately public action with `// nosemgrep: standards.server-action-missing-auth-guard - public: <reason>`.
    severity: WARNING
    languages: [typescript, javascript]
    metadata:
      category: security
      owasp: ["A01:2021 Broken Access Control", "API5:2023 Broken Function Level Authorization"]
      confidence: LOW
    patterns:
      - pattern-inside: |
          "use server"
          ...
      - pattern-either:
          - pattern: 'export async function $F(...) { ... }'
          - pattern: 'export const $F = async (...) => { ... }'
      - pattern-not: 'export async function $F(...) { ... requireAuth(...) ... }'
      - pattern-not: 'export async function $F(...) { ... requireStaff(...) ... }'
      - pattern-not: 'export async function $F(...) { ... requireRole(...) ... }'
      - pattern-not: 'export async function $F(...) { ... requireSelfOrAdmin(...) ... }'
      - pattern-not: 'export async function $F(...) { ... requireAdmin(...) ... }'
      - pattern-not: 'export async function $F(...) { ... requireTicketToken(...) ... }'
      - pattern-not: 'export async function $F(...) { ... requireBookingToken(...) ... }'
      - pattern-not: 'export async function $F(...) { ... getServerSession(...) ... }'
      - pattern-not: 'export async function $F(...) { ... auth(...) ... }'
      - pattern-not: 'export async function $F(...) { ... verifyIdToken(...) ... }'
      - pattern-not: 'export const $F = async (...) => { ... requireAuth(...) ... }'
      - pattern-not: 'export const $F = async (...) => { ... requireStaff(...) ... }'
      - pattern-not: 'export const $F = async (...) => { ... requireRole(...) ... }'
      - pattern-not: 'export const $F = async (...) => { ... requireSelfOrAdmin(...) ... }'
      - pattern-not: 'export const $F = async (...) => { ... requireAdmin(...) ... }'
      - pattern-not: 'export const $F = async (...) => { ... requireTicketToken(...) ... }'
      - pattern-not: 'export const $F = async (...) => { ... requireBookingToken(...) ... }'
      - pattern-not: 'export const $F = async (...) => { ... getServerSession(...) ... }'
      - pattern-not: 'export const $F = async (...) => { ... auth(...) ... }'
      - pattern-not: 'export const $F = async (...) => { ... verifyIdToken(...) ... }'
    # Heuristic starting point, not a proof: it recognises these guard names (add your own by extending the two
    # pattern-not lists) and cannot see guards hidden in helpers. Treat hits as review prompts.

  - id: standards.react-dangerously-set-inner-html
    message: >-
      dangerouslySetInnerHTML with a non-literal value renders unsanitized HTML (XSS). Sanitize with a vetted
      library (e.g. DOMPurify.sanitize) at this call site, or render text/markdown through a safe component.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      owasp: ["A03:2021 Injection"]
      confidence: HIGH
    patterns:
      - pattern: '<$EL dangerouslySetInnerHTML={{__html: $X}} ... />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: "..."}} ... />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(...)}} ... />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: sanitizeHtml(...)}} ... />'

  - id: standards.unsanitized-html-sink
    message: >-
      Assigning a dynamic value to innerHTML/outerHTML or calling document.write/insertAdjacentHTML writes
      unsanitized HTML (XSS). Use textContent, or sanitize the value first.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      owasp: ["A03:2021 Injection"]
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: '$EL.innerHTML = $X'
          - pattern: '$EL.outerHTML = $X'
          - pattern: 'document.write($X)'
          - pattern: 'document.writeln($X)'
          - pattern: '$EL.insertAdjacentHTML($POS, $X)'
      - pattern-not: '$EL.innerHTML = "..."'
      - pattern-not: '$EL.outerHTML = "..."'
      - pattern-not: 'document.write("...")'
      - pattern-not: 'document.writeln("...")'
      - pattern-not: '$EL.insertAdjacentHTML($POS, "...")'
      - pattern-not: '$EL.innerHTML = DOMPurify.sanitize(...)'
      - pattern-not: '$EL.insertAdjacentHTML($POS, DOMPurify.sanitize(...))'

  - id: standards.insecure-random-for-secret
    message: >-
      Math.random() is not cryptographically secure. Do not use it for tokens, passwords, codes, nonces or
      session ids. Use crypto.randomBytes / crypto.randomUUID / crypto.getRandomValues.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      owasp: ["A02:2021 Cryptographic Failures"]
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: 'const $VAR = <... Math.random() ...>'
          - pattern: 'let $VAR = <... Math.random() ...>'
          - pattern: '$VAR = <... Math.random() ...>'
          - pattern: '$OBJ.$VAR = <... Math.random() ...>'
          - pattern: |
              { ..., $VAR: <... Math.random() ...>, ... }
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(token|secret|passw|nonce|otp|apikey|api_key|session|csrf|salt|credential|resetcode|pin|signature).*

  - id: standards.server-action-error-message-passthrough
    message: >-
      A server action returns the caught error's message to the client. Internal messages leak stack, SQL,
      paths or rule names. Log the error server-side and return a fixed, user-safe message with a code.
    severity: WARNING
    languages: [typescript, javascript]
    metadata:
      category: security
      owasp: ["A04:2021 Insecure Design", "API8:2023 Security Misconfiguration"]
      confidence: MEDIUM
    patterns:
      - pattern-inside: |
          "use server"
          ...
      - pattern-inside: |
          catch ($E) { ... }
      - pattern-either:
          - pattern: 'return {..., $K: $E.message, ...}'
          - pattern: 'return {..., $K: String($E), ...}'
          - pattern: 'return {..., $K: `...${$E.message}...`, ...}'
          - pattern: 'return {..., $K: $E instanceof Error ? $E.message : $FALLBACK, ...}'
