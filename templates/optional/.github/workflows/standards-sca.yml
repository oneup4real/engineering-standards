# Opt-in (npx oneup-standards add sca): software composition analysis with a severity gate.
# Level: repository variable STANDARDS_AUDIT_LEVEL (low, moderate, high, critical; default high).
# Reports only until STANDARDS_SCA_BLOCKING=true is set.
name: standards-sca

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    env:
      LEVEL: ${{ vars.STANDARDS_AUDIT_LEVEL || 'high' }}
      BLOCKING: ${{ vars.STANDARDS_SCA_BLOCKING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: npm audit (production dependencies)
        run: |
          if npm audit --omit=dev --audit-level="$LEVEL"; then exit 0; fi
          if [ "$BLOCKING" = "true" ]; then exit 1; fi
          echo "::warning::npm audit found vulnerabilities at $LEVEL or above. Report-only until STANDARDS_SCA_BLOCKING=true."
