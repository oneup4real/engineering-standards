# Opt-in (npx oneup-standards add mutation): Stryker on the source files changed in the pull request only.
# Needs devDependencies @stryker-mutator/core and @stryker-mutator/vitest-runner plus stryker.config.mjs.
# Thresholds only warn until STANDARDS_MUTATION_BREAK=<percent> is set as a repository variable.
name: standards-mutation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker-changed-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRYKER_BREAK: ${{ vars.STANDARDS_MUTATION_BREAK }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Mutate changed source files
        run: |
          if [ -z "$BASE_REF" ]; then echo "::notice::Not a pull request; nothing to diff."; exit 0; fi
          if [ ! -d node_modules/@stryker-mutator/core ]; then
            echo "::warning::@stryker-mutator/core is not installed; mutation testing skipped."; exit 0
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- 'src/**/*.ts' 'src/**/*.tsx' | grep -Ev '\.(test|spec)\.' | paste -sd, - || true)
          if [ -z "$FILES" ]; then echo "No changed source files."; exit 0; fi
          STRYKER_MUTATE="$FILES" npx stryker run
