# Reusable security scans: secrets, code (CodeQL or Semgrep), vulnerable dependencies.
# Consumers call it with: uses: oneup4real/engineering-standards/.github/workflows/security.yml@v1
name: security

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        default: '22'
      codeql:
        description: Run GitHub CodeQL (free for public repos; private repos need Advanced Security)
        type: boolean
        default: true
      semgrep:
        description: Run Semgrep (works for private repos without Advanced Security)
        type: boolean
        default: false
      audit-level:
        description: Fail npm audit at this severity or above (low, moderate, high, critical)
        type: string
        default: high

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan full git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=${{ inputs.audit-level }}

  codeql:
    if: ${{ inputs.codeql }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  semgrep:
    if: ${{ inputs.semgrep }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Static analysis (fails on findings)
        run: semgrep scan --config p/typescript --config p/react --config p/nextjs --config p/secrets --error --metrics=off

  dependency-review:
    # Needs the dependency graph API, which private repos only get with Advanced Security (same as CodeQL).
    if: ${{ github.event_name == 'pull_request' && inputs.codeql }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
